name: Build Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

# 连续推送时, 自动取消同一分支上还在跑的旧构建, 只保留最新一次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # 2.3.2 的 BUILD.md 要求 NDK r28c
      - name: Install NDK r28c
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      # app/build.gradle 指定了 CMake 4.1.2
      - name: Install CMake 4.1.2
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;4.1.2"

      # 仓库里没有子模块内容, 从上游 2.3.2 拉取 libgocryptfs / libcryfs / libpdfviewer / ffmpeg
      - name: Fetch submodules from upstream
        run: |
          need=0
          for d in libpdfviewer app/libgocryptfs app/libcryfs app/ffmpeg/ffmpeg; do
            if [ -z "$(ls -A "$d" 2>/dev/null)" ]; then need=1; fi
          done
          if [ "$need" = "1" ]; then
            # tangled.org 的地址已失效, 改用 GitHub 上的上游镜像 (hardcore-sushi), 固定在 v2.3.2
            git clone --depth 1 --branch v2.3.2 https://github.com/hardcore-sushi/DroidFS /tmp/upstream
            cd /tmp/upstream
            fix_urls() { sed -i 's#https://tangled.org/cipherd.arkensys.dedyn.io/#https://github.com/hardcore-sushi/#' .gitmodules; git submodule sync -q; }
            fix_urls
            git submodule update --init --depth 1 libpdfviewer app/libgocryptfs app/libcryfs
            (cd app/libgocryptfs && fix_urls && git submodule update --init --depth 1)
            (cd app/libcryfs && fix_urls && git submodule update --init --depth 1)
            cd "$GITHUB_WORKSPACE"
            for d in libpdfviewer app/libgocryptfs app/libcryfs app/ffmpeg/ffmpeg; do
              if [ -z "$(ls -A "$d" 2>/dev/null)" ]; then
                rm -rf "$d"
                mkdir -p "$(dirname "$d")"
                cp -a "/tmp/upstream/$d" "$d" 2>/dev/null || true
                find "$d" -name .git -exec rm -rf {} + 2>/dev/null || true
              fi
            done
          fi
          # FFmpeg 最后兜底 (libmux.c 需要 FFmpeg 7.x 的 API)
          if [ ! -f app/ffmpeg/ffmpeg/configure ]; then
            rm -rf app/ffmpeg/ffmpeg
            git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git app/ffmpeg/ffmpeg
          fi
          ls libpdfviewer app/libgocryptfs app/libcryfs app/ffmpeg/ffmpeg | head -60

      # FFmpeg / libgocryptfs 源码固定在 v2.3.2, 编译结果只在 build.sh 变化时才需要重编
      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: app/ffmpeg/build
          key: ffmpeg-arm64-n7.1-v2.3.2-${{ hashFiles('app/ffmpeg/build.sh') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          cd app/ffmpeg
          chmod +x build.sh
          ./build.sh arm64-v8a

      - name: Cache libgocryptfs build
        id: gocryptfs-cache
        uses: actions/cache@v4
        with:
          path: |
            app/libgocryptfs/build
            app/libgocryptfs/lib
            app/libgocryptfs/include
          key: gocryptfs-arm64-v2.3.2-${{ hashFiles('app/libgocryptfs/build.sh') }}

      - name: Build libgocryptfs
        if: steps.gocryptfs-cache.outputs.cache-hit != 'true'
        run: |
          cd app/libgocryptfs
          chmod +x build.sh
          ./build.sh arm64-v8a

      # 缓存 C++ 编译结果 (libcryfs 等), 只改 Kotlin 时可以直接命中
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-arm64-${{ github.ref_name }}
          restore-keys: ccache-arm64-
          max-size: 500M

      # ---- mpv 播放引擎: 编译 mpv-android 官方的原生库 (libmpv + ffmpeg + libplayer), 只编 arm64 ----
      - name: Install packages for mpv
        run: |
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install --break-system-packages meson

      - name: Cache mpv native prefix
        id: mpv-cache
        uses: actions/cache@v4
        with:
          path: mpv-native/buildscripts/prefix
          key: mpv-prefix-arm64-${{ hashFiles('mpv-native/buildscripts/include/depinfo.sh', 'mpv-native/buildscripts/scripts/**') }}

      - name: Build mpv native libs (arm64)
        run: |
          cd mpv-native/buildscripts
          chmod +x *.sh include/*.sh scripts/*.sh
          export WGET="wget --progress=dot:giga"
          mkdir -p sdk
          ln -sfn "$ANDROID_HOME" sdk/android-sdk-linux
          IN_CI=1 ./include/download-sdk.sh
          if [ ! -f prefix/arm64/lib/libmpv.so ]; then
            IN_CI=1 ./include/download-deps.sh
            mkdir -p deps/mpv
            $WGET https://github.com/mpv-player/mpv/archive/master.tar.gz -O master.tgz
            tar -xzf master.tgz -C deps/mpv --strip-components=1
            rm master.tgz
            ./buildall.sh --only-deps mpv --arch arm64
          fi
          mkdir -p deps/mpv
          if [ -z "$(ls -A deps/mpv 2>/dev/null)" ]; then
            $WGET https://github.com/mpv-player/mpv/archive/master.tar.gz -O master.tgz
            tar -xzf master.tgz -C deps/mpv --strip-components=1
            rm master.tgz
          fi
          ./buildall.sh -n mpv --arch arm64

      - name: Build libplayer.so (mpv JNI)
        run: |
          NDK="$GITHUB_WORKSPACE/mpv-native/buildscripts/sdk/android-ndk-r30"
          PREFIX64="$GITHUB_WORKSPACE/mpv-native/buildscripts/prefix/arm64" \
          "$NDK/ndk-build" -C mpv-native/src -j"$(nproc)" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            NDK_OUT="$GITHUB_WORKSPACE/mpv-native/src/obj"
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Assemble release APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -Pabi=arm64-v8a --stacktrace

      - name: Verify native libs in APK
        run: |
          for f in app/build/outputs/apk/release/*.apk; do
            echo "== $f"; unzip -l "$f" | grep "lib/"
          done

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: droidfs-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
